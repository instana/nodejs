          #!/usr/bin/env bash
          set -eo pipefail

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js

          # collect test files
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/async/bluebird \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No test files found for bluebird — skipping.'
            exit 0
          fi

          exec env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            CI=true \
            TEST_FILES="$TEST_FILES" \
            npm run test:ci:collector
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
      - name: sign-artifact
        when: 'false'
  pr-code-build-collector-async-native-promise:
    from: pr-code-build
    displayName: native_promise
    runtimeClassName: large
    steps:
      - name: unit-test
        displayName: native_promise
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js

          # collect test files
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/async/native_promise \
