            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No test files found for native_promise — skipping.'
            exit 0
          fi

          exec env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            CI=true \
            TEST_FILES="$TEST_FILES" \
            npm run test:ci:collector
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
      - name: sign-artifact
        when: 'false'
  code-pr-finish:
    steps:
      - name: run-stage
        when: 'false'
