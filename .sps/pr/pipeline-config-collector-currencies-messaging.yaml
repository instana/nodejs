version: '2'
tasks:
  pr-code-checks:
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-pr-finish:
    when: 'false'
  code-ci-finish:
    when: 'false'
  deploy-checks:
    when: false
  deploy-release:
    when: false
  pr-code-checks-collector-messaging-kafka-javascript:
    from: pr-code-checks
    displayName: '@confluentinc/kafka-javascript'
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: '@confluentinc/kafka-javascript'
        image: mirror.gcr.io/library/node:24
        include:
          - docker-socket
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          # install docker client
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg netcat-openbsd socat
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          # create isolated network
          docker network create --internal offline-net

          npm install --loglevel warn --foreground-scripts

          # start zookeeper
          docker run -d --network offline-net --name zookeeper \
            -e ZOOKEEPER_CLIENT_PORT="2181" \
            "mirror.gcr.io/confluentinc/cp-zookeeper:7.9.4"
          SIDECAR_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' zookeeper)
          socat TCP-LISTEN:2181,fork,reuseaddr,bind=127.0.0.1 TCP:$SIDECAR_IP:2181 &
          socat TCP6-LISTEN:2181,fork,reuseaddr,bind=[::1],ipv6only=1 TCP:$SIDECAR_IP:2181 &
          timeout 60 bash -c \
            'until nc -z 127.0.0.1 2181 2>/dev/null; do sleep 2; done'

          # start kafka
          docker run -d --network offline-net --name kafka \
            -e KAFKA_BROKER_ID="1" \
            -e KAFKA_ZOOKEEPER_CONNECT="zookeeper:2181" \
            -e KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://127.0.0.1:29092,EXTERNAL://127.0.0.1:9092" \
            -e KAFKA_LISTENERS="EXTERNAL://:9092,PLAINTEXT://:29092" \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR="1" \
            -e KAFKA_DEFAULT_REPLICATION_FACTOR="1" \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP="PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,EXTERNAL:PLAINTEXT" \
            "mirror.gcr.io/confluentinc/cp-kafka:7.9.4"
          SIDECAR_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' kafka)
          socat TCP-LISTEN:9092,fork,reuseaddr,bind=127.0.0.1 TCP:$SIDECAR_IP:9092 &
          socat TCP6-LISTEN:9092,fork,reuseaddr,bind=[::1],ipv6only=1 TCP:$SIDECAR_IP:9092 &
          socat TCP-LISTEN:29092,fork,reuseaddr,bind=127.0.0.1 TCP:$SIDECAR_IP:29092 &
          socat TCP6-LISTEN:29092,fork,reuseaddr,bind=[::1],ipv6only=1 TCP:$SIDECAR_IP:29092 &
          timeout 120 bash -c \
            'until nc -z 127.0.0.1 9092 2>/dev/null; do sleep 3; done'

          # start kafka-topics
          docker run -d --network offline-net --name kafka-topics \
            --entrypoint "/bin/bash" \
            "mirror.gcr.io/confluentinc/cp-kafka:7.9.4" "-lc" "kafka_server=\"0.0.0.0:9092\"; kafka_topics=\"test test-topic test-batch-topic rdkafka-topic confluent-kafka-topic\"; until kafka-topics --bootstrap-server \"$kafka_server\" --list >/dev/null 2>&1; do echo 'waiting for Kafka...'; sleep 2; done; for t in $kafka_topics; do kafka-topics --bootstrap-server \"$kafka_server\" --create --if-not-exists --topic \"$t\"; done; echo 'All topics created.'"
          sleep 120

          node bin/create-version-test-folders.js

          # collect test files
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/messaging/@confluentinc/kafka-javascript \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No test files found for @confluentinc/kafka-javascript — skipping.'
            exit 0
          fi

          RUN_ESM="$(get_env RUN_ESM "")"
          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              CI=true \
              RUN_ESM="$RUN_ESM" \
              TEST_FILES="$TEST_FILES" \
              npm run coverage-ci --npm_command="test:ci:collector" --report_dir="collector-messaging-kafka-javascript" || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done

          # upload executed test files + lcov coverage report to COS
          COS_API_KEY="$(get_secret ibm-object-storage-api-key)"
          GIT_COMMIT="$(get_env HEAD_SHA "")"
          if [ -n "$COS_API_KEY" ] && [ -n "$GIT_COMMIT" ]; then
            IAM_TOKEN=$(curl -sf -X POST "https://iam.cloud.ibm.com/identity/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=$COS_API_KEY" \
              | grep -o '"access_token":"[^"]*"' | sed 's/"access_token":"//;s/"//')
            curl -sf -X PUT \
              "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/collector-messaging-kafka-javascript.txt" \
              -H "Authorization: Bearer $IAM_TOKEN" \
              -H "Content-Type: text/plain" \
              --data-binary "$(echo "$TEST_FILES" | tr ' ' '\n' | sort)" \
              && echo "Uploaded test list for collector-messaging-kafka-javascript → test-results/$GIT_COMMIT/collector-messaging-kafka-javascript.txt" \
              || echo "WARNING: Failed to upload test list for collector-messaging-kafka-javascript (non-fatal)"
            NODE_MAJOR="${node_version%%.*}"
            if [ "$NODE_MAJOR" != "24" ]; then
              echo "Skip: lcov upload — not the development node major version ($NODE_MAJOR != 24)"
            else
              LCOV_FILE="coverage/collector-messaging-kafka-javascript/lcov.info"
              if [ -f "$LCOV_FILE" ]; then
                curl -sf -X PUT \
                  "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/coverage/collector-messaging-kafka-javascript/lcov.info" \
                  -H "Authorization: Bearer $IAM_TOKEN" \
                  -H "Content-Type: text/plain" \
                  --data-binary @"$LCOV_FILE" \
                  && echo "Uploaded lcov for collector-messaging-kafka-javascript → test-results/$GIT_COMMIT/coverage/collector-messaging-kafka-javascript/lcov.info" \
                  || echo "WARNING: Failed to upload lcov for collector-messaging-kafka-javascript (non-fatal)"
              else
                echo "WARNING: lcov not found at $LCOV_FILE — skipping lcov upload"
              fi
            fi
          else
            echo "WARNING: COS credentials or git commit unavailable — skipping uploads"
          fi

          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
