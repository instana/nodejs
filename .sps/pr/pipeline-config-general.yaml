version: '2'
tasks:
  pr-code-checks:
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-pr-finish:
    steps:
      - name: run-stage
        when: 'false'
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
  deploy-checks:
    when: false
  deploy-release:
    when: false
  pr-code-checks-general:
    from: pr-code-checks
    displayName: pr-general
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: pr-general
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          echo "--- audit ---"
          npm run audit

          echo "--- lint ---"
          npm run lint

          echo "--- commitlint ---"
          node_modules/.bin/commitlint --from $(git describe --tags --abbrev=0)

          echo "--- depcheck ---"
          npm run depcheck
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
