  pr-code-checks-collector-frameworks-sequelize:
    from: pr-code-checks
    displayName: sequelize
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: sequelize
        image: mirror.gcr.io/library/node:24
        include:
          - docker-socket
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          # install docker client
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg netcat-openbsd socat
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          # create isolated network
          docker network create --internal offline-net

          npm install --loglevel warn --foreground-scripts

          # start postgres
          docker run -d --network offline-net --name postgres \
            -e POSTGRES_USER="node" \
            -e POSTGRES_PASSWORD="nodepw" \
            -e POSTGRES_DB="nodedb" \
            "mirror.gcr.io/library/postgres:15.15"
          SIDECAR_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' postgres)
          socat TCP-LISTEN:5432,fork,reuseaddr,bind=127.0.0.1 TCP:$SIDECAR_IP:5432 &
          timeout 60 bash -c \
            'until nc -z 127.0.0.1 5432 2>/dev/null; do sleep 2; done'

          node bin/create-version-test-folders.js

          # collect test files
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/frameworks/sequelize \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No test files found for sequelize — skipping.'
            exit 0
          fi

          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              CI=true \
              TEST_FILES="$TEST_FILES" \
              npm run test:ci:collector || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
