version: '2'
tasks:
  pr-code-checks:
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="$(get_env node-version 2>/dev/null || true)"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version" --no-progress
            nvm use "$node_version"
            ACTUAL=$(node --version)
            if [[ "$ACTUAL" != "v${node_version}"* ]]; then
              echo "ERROR: expected Node.js v${node_version} but got ${ACTUAL}"
              exit 1
            fi
          fi
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
  deploy-checks:
    when: false
  deploy-release:
    when: false
  pr-code-checks-collector-cloud-aws-sdkclient-dynamodb:
    from: pr-code-checks
    displayName: '@aws-sdk/client-dynamodb'
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: '@aws-sdk/client-dynamodb'
        image: mirror.gcr.io/library/node:24
        include:
          - docker-socket
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="$(get_env node-version 2>/dev/null || true)"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version" --no-progress
            nvm use "$node_version"
            ACTUAL=$(node --version)
            if [[ "$ACTUAL" != "v${node_version}"* ]]; then
              echo "ERROR: expected Node.js v${node_version} but got ${ACTUAL}"
              exit 1
            fi
          fi
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          # install docker client
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg netcat-openbsd
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js

          # start localstack
          docker run -d --network host --name localstack \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "mirror.gcr.io/localstack/localstack:4.5"
          timeout 60 bash -c \
            'until nc -z 127.0.0.1 4566 2>/dev/null; do sleep 2; done'

          # collect test files
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/cloud/@aws-sdk/client-dynamodb \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No test files found for @aws-sdk/client-dynamodb — skipping.'
            exit 0
          fi

          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              CI=true \
              INSTANA_CONNECT_LOCALSTACK_AWS="http://127.0.0.1:4566" \
              TEST_FILES="$TEST_FILES" \
              npm run test:ci:collector || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
