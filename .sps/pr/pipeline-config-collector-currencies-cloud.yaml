version: '2'
tasks:
  pr-code-checks:
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          # log and optionally switch Node.js version
          # SPS exposes "node-version" trigger property — map to bash-safe variable
          node_version="${node_version:-${node-version:-}}"
          echo "node_version property: ${node_version:-<not set>}"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version"
            nvm use "$node_version"
            ACTUAL=$(node --version)
            EXPECTED="v${node_version}"
            if [[ "$ACTUAL" != "$EXPECTED"* ]]; then
              echo "ERROR: expected Node.js ${EXPECTED} but got ${ACTUAL}"
              exit 1
            fi
            echo "Node.js switched to: $ACTUAL"
          else
            echo "Node.js version (image default): $(node --version)"
          fi

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
  pr-code-checks-collector-cloud-aws-sdkclient-dynamodb:
    from: pr-code-checks
    displayName: '@aws-sdk/client-dynamodb'
