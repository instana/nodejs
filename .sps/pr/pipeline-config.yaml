version: '2'
tasks:
  pr-code-checks:
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
      - name: compliance-checks
      - name: unit-test
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set-commit-status \
            --repository "$(load_repo app-repo url)" \
            --commit-sha "$(load_repo app-repo commit)" \
            --state "success" \
            --description "General PR checks passed." \
            --context "tekton/pr-code-checks/code-unit-tests" \
            --task-name "pr-code-checks" \
            --step-name "unit-test"
  sign-artifact:
    when: 'false'
  deploy-checks:
    when: 'false'
  deploy-release:
    when: 'false'
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
