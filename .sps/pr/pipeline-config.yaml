version: '2'
tasks:
  pr-code-checks:
    steps:
      - name: peer-review
        when: 'false'
      - name: unit-test
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          echo "General PR checks passed."
  code-pr-finish:
    steps:
      - name: run-stage
        when: 'false'
  sign-artifact:
    when: 'false'
  deploy-checks:
    when: 'false'
  deploy-release:
    when: 'false'
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
