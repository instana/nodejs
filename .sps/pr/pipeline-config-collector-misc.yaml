version: '2'
tasks:
  pr-code-checks:
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="$(get_env node-version 2>/dev/null || true)"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version" --no-progress
            nvm use "$node_version"
            ACTUAL=$(node --version)
            if [[ "$ACTUAL" != "v${node_version}"* ]]; then
              echo "ERROR: expected Node.js v${node_version} but got ${ACTUAL}"
              exit 1
            fi
          fi
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-pr-finish:
    steps:
      - name: run-stage
        when: 'false'
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
  deploy-checks:
    when: false
  deploy-release:
    when: false
  pr-code-checks-misc-1:
    from: pr-code-checks
    displayName: collector-misc-1
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: collector-misc-1
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="$(get_env node-version 2>/dev/null || true)"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version" --no-progress
            nvm use "$node_version"
            ACTUAL=$(node --version)
            if [[ "$ACTUAL" != "v${node_version}"* ]]; then
              echo "ERROR: expected Node.js v${node_version} but got ${ACTUAL}"
              exit 1
            fi
          fi
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          node bin/create-version-test-folders.js

          # collect test files
          TEST_FILES=$(cd packages/collector && find \
            test/integration/misc/actions \
            test/integration/misc/activate_immediately \
            test/integration/misc/agent-logs \
            test/integration/misc/agent_connection \
            test/integration/misc/babel_typescript \
            test/integration/misc/cjs-via-esm \
            test/integration/misc/cls-hooked-conflict \
            test/integration/misc/common \
            test/integration/misc/disabled \
            test/integration/misc/immediate \
            test/integration/misc/invalid_app \
            test/integration/misc/logger_spans \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No test files found for collector-misc-1 — skipping.'
            exit 0
          fi

          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              CI=true \
              TEST_FILES="$TEST_FILES" \
              npm run test:ci:collector || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
