version: '2'
tasks:
  code-checks:
    steps:
      - name: peer-review
        when: 'false'
  code-build:
    runtimeClassName: large
    steps:
      - name: build-artifact
        displayName: npm-install
        image: public.ecr.aws/docker/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: unit-test
        when: 'false'
      - name: scan-artifact
        when: 'false'
      - name: sign-artifact
        when: 'false'
  pr-collector-currencies-messaging:
    from: code-build
    displayName: pr-collector-currencies-messaging
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: confluentinckafka-javascript
        displayName: '@confluentinc/kafka-javascript'
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          cd "$WORKSPACE/$(load_repo app-repo path)"

          # install docker client
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg netcat-openbsd
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          # start kafka
          docker run -d --network host --name kafka \
            -e KAFKA_BROKER_ID="1" \
            -e KAFKA_ZOOKEEPER_CONNECT="localhost:2181" \
            -e KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://127.0.0.1:29092,EXTERNAL://localhost:9092" \
            -e KAFKA_LISTENERS="EXTERNAL://:9092,PLAINTEXT://:29092" \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR="1" \
            -e KAFKA_DEFAULT_REPLICATION_FACTOR="1" \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP="PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,EXTERNAL:PLAINTEXT" \
            "public.ecr.aws/aktosecurity/confluentinc-cp-kafka:7.9.4-1-ubi8"
          timeout 150 bash -c 'until nc -z 127.0.0.1 9092 2>/dev/null; do sleep 2; done'

          # start kafka-topics
          docker run -d --network host --name kafka-topics \
            --entrypoint "/bin/bash" \
            "public.ecr.aws/aktosecurity/confluentinc-cp-kafka:7.9.4-1-ubi8" "-lc" "kafka_server=\"0.0.0.0:9092\"; kafka_topics=\"test test-topic test-batch-topic rdkafka-topic confluent-kafka-topic\"; until kafka-topics --bootstrap-server \"$kafka_server\" --list >/dev/null 2>&1; do echo 'waiting for Kafka...'; sleep 2; done; for t in $kafka_topics; do kafka-topics --bootstrap-server \"$kafka_server\" --create --if-not-exists --topic \"$t\"; done; echo 'All topics created.'"

          # strip all env vars except the bare minimum needed to run npm
          _PATH="$PATH"
          _HOME="$HOME"
          unset $(env | cut -d= -f1 | grep -v "^_" | tr '\n' ' ')
          export PATH="$_PATH" HOME="$_HOME" CI=true

          export TEST_FILES
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/messaging/@confluentinc/kafka-javascript \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No test files found for @confluentinc/kafka-javascript — skipping.'
            exit 0
          fi

          TEST_FILES="$TEST_FILES" npm run test:ci:collector
      - name: amqplib
