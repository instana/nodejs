          npm install --loglevel warn --foreground-scripts
          npm run test:ci:serverless-collector
      - name: sign-artifact
        when: 'false'

  # ── collector general (http, frameworks, protocols, logging, misc, etc.) ────
  # All collector integration tests that do NOT require a Docker sidecar service.
  # This covers: http, http2, grpc, graphql, apollo, express, koa, fastify,
  # restify, got, tsoa, typeorm, logging (bunyan/winston/pino/etc.), async,
  # cloud (azure/gcp), messaging (socket.io, bull), and all misc tests.
  collector-general-tests:
    from: code-build
    displayName: collector-general-tests
    runtimeClassName: large
    steps:
      - name: build-artifact
        displayName: collector-general-tests
        image: public.ecr.aws/docker/library/node:24
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          export CI=true
          node bin/create-version-test-folders.js

          # ── Collect all collector tests that don't need a Docker service ─────
          # Protocols with sidecar deps are excluded here and run in their own tasks:
          #   graphql / graphql-subscriptions → collector-rabbitmq-tests (needs RabbitMQ)
          # Framework tests with sidecar deps are also excluded:
          #   sequelize / typeorm / restify   → collector-postgres-tests (needs Postgres)
          # messaging/bull                    → collector-redis-tests (needs Redis)
          export TEST_FILES
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/protocols/@apollo \
            test/integration/currencies/protocols/@grpc \
            test/integration/currencies/protocols/http \
            test/integration/currencies/protocols/http2 \
            test/integration/currencies/frameworks/@hapi \
            test/integration/currencies/frameworks/@koa \
            test/integration/currencies/frameworks/express \
            test/integration/currencies/frameworks/fastify \
            test/integration/currencies/frameworks/got \
            test/integration/currencies/frameworks/tsoa \
            test/integration/currencies/logging \
            test/integration/currencies/async \
            test/integration/currencies/core \
            test/integration/currencies/cloud/@azure \
            test/integration/currencies/cloud/@google-cloud \
            test/integration/currencies/messaging/socket.io \
            test/integration/misc \
            test/unit \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            -not -path '*/long_*/*' \
            -not -path '*/span-batching-with-redis/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'ERROR: No general collector test files found.'
            exit 1
          fi

          echo "General collector test files ($(echo "$TEST_FILES" | wc -w | xargs) files):"
          echo "$TEST_FILES" | tr ' ' '\n'

          # Runs: lerna -> packages/collector -> mocha ... $TEST_FILES
          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  # ────────────────────────────────────────────────────────────────────────────
  # SIDECAR TEST GROUPS — DinD pattern
  # include: dind on the task starts the Docker daemon.
  # include: docker-socket on the step mounts /var/run/docker.sock.
  # All services started with --network host so they're on 127.0.0.1.
  # Docker CLI is not in node:24 — installed via apt in each task.
  # ────────────────────────────────────────────────────────────────────────────

  # ── collector redis (Tekton tasks 1-20) ─────────────────────────────────────
  # Each task gets 1/20th of the collector test suite (CI_TEST_SPLIT=39,
  # CI_TEST_SPLIT_CURRENT=1..20) using redis/ioredis sidecars.
  # Mirrored from collector-1-redis-task.yaml .. collector-20-redis-task.yaml

  collector-redis-tests:
    from: code-build
    displayName: collector-redis-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-redis-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # ── Wait for the DinD docker socket to be available ──────────────────
          echo "Waiting for Docker socket..."
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'
          echo "Docker socket ready."

          # ── Install Docker CLI ───────────────────────────────────────────────
          # Resolve the Debian codename first to avoid quoting issues in the
          # echo "deb ..." line below.
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian ${CODENAME} stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start Redis primary ──────────────────────────────────────────────
          docker run -d --network host --name redis \
            public.ecr.aws/docker/library/redis:7.4.3

          # ── Start Redis replica (port 6380) ──────────────────────────────────
          docker run -d --network host --name redis-slave \
            public.ecr.aws/docker/library/redis:7.4.3 \
            redis-server --replicaof 127.0.0.1 6379 --port 6380

          # ── Start Redis Sentinel (port 26379) ────────────────────────────────
          docker run -d --network host --name redis-sentinel \
            public.ecr.aws/docker/library/redis:7.4.3 sh -c '
              echo "sentinel monitor mymaster 127.0.0.1 6379 2"          > /etc/sentinel.conf
              echo "sentinel down-after-milliseconds mymaster 1000"      >> /etc/sentinel.conf
              echo "sentinel failover-timeout mymaster 5000"             >> /etc/sentinel.conf
              echo "sentinel parallel-syncs mymaster 1"                  >> /etc/sentinel.conf
              echo "sentinel resolve-hostnames no"                       >> /etc/sentinel.conf
              redis-server /etc/sentinel.conf --sentinel --port 26379'

          # ── Wait for Redis primary to be ready ───────────────────────────────
          echo "Waiting for Redis primary..."
          timeout 30 bash -c \
            'until docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done'
          echo "Redis ready."

          export CI=true

          # ── Azure Redis cluster credentials ──────────────────────────────────
          # AZURE_REDIS_CLUSTER: static hostname — hardcoded here (same as every
          #   Tekton task). No pipeline property needed.
          # AZURE_REDIS_CLUSTER_PWD: must be a Secure env property on the pipeline.
          #   SPS injects it into the container but does NOT export it to child
          #   processes — the explicit export below is required so the full chain
          #   (lerna → npm run → mocha → ProcessControls fork → test app) inherits it.
          export AZURE_REDIS_CLUSTER="team-nodejs-redis-cluster-tekton.redis.cache.windows.net:6380" # pragma: allowlist secret
          export AZURE_REDIS_CLUSTER_PWD="${AZURE_REDIS_CLUSTER_PWD:-}" # pragma: allowlist secret
          echo "AZURE_REDIS_CLUSTER:     $AZURE_REDIS_CLUSTER"
          echo "AZURE_REDIS_CLUSTER_PWD: $([ -n "$AZURE_REDIS_CLUSTER_PWD" ] && echo '(set)' || echo 'NOT SET — add as Secure env property on this pipeline')" # pragma: allowlist secret
          if [ -z "$AZURE_REDIS_CLUSTER_PWD" ]; then
            echo "ERROR: AZURE_REDIS_CLUSTER_PWD is not set. Cluster tests will fail."
            echo "  → In the toolchain UI: pipeline → Environment properties → Add → Secure"
            echo "  → Name: AZURE_REDIS_CLUSTER_PWD"
            echo "  → Value: (from 1Password 'Team Node.js: Azure Redis cluster')"
            exit 1
          fi

          # ── Generate versioned test folders ──────────────────────────────────
          # code-build ran this too, but fan-out tasks get a fresh container.
          node bin/create-version-test-folders.js

          # ── Collect redis test files ──────────────────────────────────────────
          # All paths are relative to packages/collector/ — mocha is invoked
          # from that directory by lerna, so relative paths work correctly.
          export TEST_FILES
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/databases/redis \
            test/integration/currencies/databases/ioredis \
            'test/integration/currencies/databases/@redis' \
            test/integration/misc/span-batching-with-redis \
            test/integration/currencies/messaging/bull \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'ERROR: No redis test files found after folder generation.'
            exit 1
          fi

          echo "Redis test files ($(echo "$TEST_FILES" | wc -w | xargs) files):"
          echo "$TEST_FILES" | tr ' ' '\n'

          # Runs: lerna -> packages/collector -> mocha ... $TEST_FILES
          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  # ── collector kafka (Tekton tasks 21-26) ─────────────────────────────────────
  # Zookeeper + Kafka + kafka-topics setup; each task runs 1/6 of collector
  # tests (CI_TEST_SPLIT=39, CI_TEST_SPLIT_CURRENT=21..26).
  # All 6 splits are consolidated into one SPS task since topic creation
  # only needs to happen once and we run the full kafka subset sequentially.

  collector-kafka-tests:
    from: code-build
    displayName: collector-kafka-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-kafka-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # ── Wait for the DinD docker socket to be available ──────────────────
          echo "Waiting for Docker socket..."
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'
          echo "Docker socket ready."

          # ── Install Docker CLI ───────────────────────────────────────────────
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian ${CODENAME} stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start Zookeeper ──────────────────────────────────────────────────
          docker run -d --network host --name zookeeper \
            -e ZOOKEEPER_CLIENT_PORT=2181 \
            public.ecr.aws/aktosecurity/confluentinc-cp-zookeeper:7.9.4-1-ubi8

          # ── Wait for Zookeeper ───────────────────────────────────────────────
          echo "Waiting for Zookeeper..."
          timeout 60 bash -c \
            'until docker exec zookeeper bash -c "echo ruok | nc 127.0.0.1 2181" 2>/dev/null | grep -q imok; do sleep 2; done'
          echo "Zookeeper ready."

          # ── Start Kafka ──────────────────────────────────────────────────────
          docker run -d --network host --name kafka \
            -e KAFKA_BROKER_ID=1 \
            -e KAFKA_ZOOKEEPER_CONNECT=localhost:2181 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:29092,EXTERNAL://localhost:9092 \
            -e KAFKA_LISTENERS=EXTERNAL://:9092,PLAINTEXT://:29092 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_DEFAULT_REPLICATION_FACTOR=1 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,EXTERNAL:PLAINTEXT \
            public.ecr.aws/aktosecurity/confluentinc-cp-kafka:7.9.4-1-ubi8

          # ── Wait for Kafka ───────────────────────────────────────────────────
          echo "Waiting for Kafka broker..."
          timeout 120 bash -c \
            'until docker exec kafka kafka-topics --bootstrap-server 0.0.0.0:9092 --list >/dev/null 2>&1; do sleep 2; done'
          echo "Kafka ready."

          # ── Create required topics ───────────────────────────────────────────
          for TOPIC in test test-topic test-batch-topic rdkafka-topic confluent-kafka-topic; do
            docker exec kafka kafka-topics --bootstrap-server 0.0.0.0:9092 \
              --create --if-not-exists --topic "$TOPIC"
          done
          echo "Kafka topics created."

          export CI=true
          node bin/create-version-test-folders.js

          # ── Scope tests to this service's directories ───────────────────────
          export TEST_FILES
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/messaging/@confluentinc \
            test/integration/currencies/messaging/kafka-node \
            test/integration/currencies/messaging/kafkajs \
            test/integration/currencies/messaging/node-rdkafka \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No kafka test files found — skipping.'
            exit 0
          fi

          echo "kafka test files ($(echo "$TEST_FILES" | wc -w | xargs) files):"
          echo "$TEST_FILES" | tr ' ' '\n'

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  # ── collector postgres (Tekton tasks 27-29) ───────────────────────────────────
  collector-postgres-tests:
    from: code-build
    displayName: collector-postgres-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-postgres-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # ── Wait for the DinD docker socket to be available ──────────────────
          echo "Waiting for Docker socket..."
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'
          echo "Docker socket ready."

          # ── Install Docker CLI ───────────────────────────────────────────────
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian ${CODENAME} stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start PostgreSQL ─────────────────────────────────────────────────
          docker run -d --network host --name postgres \
            -e POSTGRES_USER=node \
            -e POSTGRES_PASSWORD=nodepw \ # pragma: allowlist secret
            -e POSTGRES_DB=nodedb \
            public.ecr.aws/docker/library/postgres:15.15

          # ── Wait for PostgreSQL ──────────────────────────────────────────────
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c \
            'until docker exec postgres pg_isready --host 127.0.0.1 --port 5432 --dbname=nodedb 2>/dev/null; do sleep 2; done'
          echo "PostgreSQL ready."

          export CI=true
          node bin/create-version-test-folders.js

          # ── Scope tests to this service's directories ───────────────────────
          export TEST_FILES
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/databases/pg \
            test/integration/currencies/databases/pg-native \
            test/integration/currencies/databases/prisma \
            test/integration/currencies/databases/sequelize \
            test/integration/currencies/databases/tedious \
            test/integration/currencies/frameworks/sequelize \
            test/integration/currencies/frameworks/typeorm \
            test/integration/currencies/frameworks/restify \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No postgres test files found — skipping.'
            exit 0
          fi

          echo "postgres test files ($(echo "$TEST_FILES" | wc -w | xargs) files):"
          echo "$TEST_FILES" | tr ' ' '\n'

          npm run test:ci:collector
      - name: sign-artifact
