version: '2'
tasks:
  pr-code-checks:
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
      - name: compliance-checks
      - name: unit-test
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          bash bin/install-npm.sh
          npm install --loglevel warn --ignore-scripts
          node bin/create-version-test-folders.js
  code-pr-finish:
    when: 'false'
  sign-artifact:
    when: 'false'
  deploy-checks:
    when: 'false'
  deploy-release:
    when: 'false'
  code-ci-finish:
    when: 'false'
  pr-code-checks-list-cve-issues:
    from: pr-code-checks
    displayName: list-cve-issues
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: list-cve-issues
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          export GH_HOST=github.ibm.com
          export GH_ENTERPRISE_TOKEN="$(get_secret git-token)"
          REPO="instana/instana-issues"

          mkdir -p -m 755 /etc/apt/keyrings
          wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] \
            https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update -qq && apt-get install -y -qq gh jq

          ISSUES=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --limit 1000 \
            --json number,title,url,body \
            --jq '.[] | select(.body | test("Subject:[[:space:]]*`?https://github[.]com/instana/nodejs`?([[:space:]]|$)")) | [.number, .title, .url] | @tsv')

          if [[ -z "$ISSUES" ]]; then
            echo "No open CVE issues found for https://github.com/instana/nodejs."
            exit 0
          fi

          echo "Open CVE issues for https://github.com/instana/nodejs:"
          while IFS=$'\t' read -r NUMBER TITLE URL; do
            echo "  #${NUMBER}  ${TITLE}  ${URL}"
          done <<< "$ISSUES"
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
