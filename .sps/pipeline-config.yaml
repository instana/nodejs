version: '2'
tasks:
  code-checks:
    steps:
      - name: peer-review
        when: 'false'
  code-build:
    runtimeClassName: large
    steps:
      - name: build-artifact
        displayName: npm-install
        image: public.ecr.aws/docker/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: unit-test
        when: 'false'
      - name: scan-artifact
        when: 'false'
      - name: sign-artifact
        when: 'false'
  sign-artifact:
    when: 'false'
  deploy-checks:
    when: 'false'
  deploy-release:
    when: 'false'
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
