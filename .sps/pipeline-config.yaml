            test/integration/currencies/messaging/amqplib \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No test files found for amqplib — skipping.'
            exit 0
          fi

          TEST_FILES="$TEST_FILES" npm run test:ci:collector
