version: '2'

tasks:
  code-checks:
    steps:
      - name: peer-review
        when: false

  # ── Install dependencies ─────────────────────────────────────────────────────
  # Base task. All test tasks fan out from this via `from: code-build`.
  # NOTE: fan-out tasks get a fresh container — node_modules are NOT shared.
  # Each test task must run npm install itself before running tests.
  code-build:
    runtimeClassName: large
    steps:
      - name: build-artifact
        displayName: npm-install
        image: public.ecr.aws/docker/library/node:24
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          npm install --loglevel warn --foreground-scripts
          echo "npm install done."

          # Generate versioned test folders (_v*/) from currencies.json + templates.
          # Tekton does this in its prepare-test-env/generate-test-folders step;
          # in SPS we run it in code-build so all fan-out tasks inherit the output.
          node bin/create-version-test-folders.js
      - name: unit-test
        when: 'false'
      - name: scan-artifact
        when: 'false'
      - name: sign-artifact
        when: 'false'

  # ── Non-sidecar test group: core ─────────────────────────────────────────────
  core-tests:
    from: code-build
    displayName: core-tests
    runtimeClassName: large
    steps:
      - name: build-artifact
        displayName: core-tests
        image: public.ecr.aws/docker/library/node:24
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"

          # Fan-out tasks get a fresh container — install deps first
          npm install --loglevel warn --foreground-scripts

          npm run test:ci:core
      - name: sign-artifact
        when: 'false'

  # ── Sidecar test group: collector redis ──────────────────────────────────────
  # DinD + docker-socket to start redis services on --network host (localhost).
  # Mirrors Tekton collector-1-redis-task.yaml sidecars behavior.
  collector-redis-tests:
    from: code-build
    displayName: collector-redis-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-redis-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"

          # Fan-out tasks get a fresh container — install deps first
          npm install --loglevel warn --foreground-scripts

          # ── Install Docker CLI (not included in node:24 image) ───────────────
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq
          apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start Redis primary ──────────────────────────────────────────────
          docker run -d --network host --name redis \
            public.ecr.aws/docker/library/redis:7.4.3

          # ── Start Redis replica ──────────────────────────────────────────────
          docker run -d --network host --name redis-slave \
            public.ecr.aws/docker/library/redis:7.4.3 \
            redis-server --replicaof 127.0.0.1 6379 --port 6380

          # ── Start Redis Sentinel ─────────────────────────────────────────────
          docker run -d --network host --name redis-sentinel \
            public.ecr.aws/docker/library/redis:7.4.3 sh -c '
              echo "sentinel monitor mymaster 127.0.0.1 6379 2"          > /etc/sentinel.conf
              echo "sentinel down-after-milliseconds mymaster 1000"      >> /etc/sentinel.conf
              echo "sentinel failover-timeout mymaster 5000"             >> /etc/sentinel.conf
              echo "sentinel parallel-syncs mymaster 1"                  >> /etc/sentinel.conf
              echo "sentinel resolve-hostnames no"                       >> /etc/sentinel.conf
              redis-server /etc/sentinel.conf --sentinel --port 26379'

          # ── Wait for Redis to be ready ───────────────────────────────────────
          echo "Waiting for Redis primary..."
          timeout 30 bash -c \
            'until docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done'
          echo "Redis ready."

          # ── Generate versioned test folders then find redis tests ─────────────
          export CI=true
          node bin/create-version-test-folders.js 2>&1 | grep -E 'redis|ioredis|@redis|Error|error' || true

          export TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/databases/redis \
            test/integration/currencies/databases/ioredis \
            'test/integration/currencies/databases/@redis' \
            test/integration/misc/span-batching-with-redis \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort \
            | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'No redis test files found after generation.'
            exit 1
          fi

          echo "Redis test files:"
          echo "$TEST_FILES" | tr ' ' '\n'

          # Re-export Azure Redis cluster credentials so lerna/mocha child
          # processes inherit them (SPS injects them into the container env
          # but they must be explicitly exported for child process inheritance).
          export AZURE_REDIS_CLUSTER="${AZURE_REDIS_CLUSTER:-}"
          export AZURE_REDIS_CLUSTER_PWD="${AZURE_REDIS_CLUSTER_PWD:-}"
          echo "AZURE_REDIS_CLUSTER set: $([ -n "$AZURE_REDIS_CLUSTER" ] && echo yes || echo NO)"
          echo "AZURE_REDIS_CLUSTER_PWD set: $([ -n "$AZURE_REDIS_CLUSTER_PWD" ] && echo yes || echo NO)"

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  # ── Skip signing and deploy stages ──────────────────────────────────────────
  sign-artifact:
    when: false

  deploy-checks:
    when: false

  deploy-release:
    when: false

  code-ci-finish:
    steps:
      - name: run-stage
        when: false

