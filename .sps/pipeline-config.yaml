      - name: sign-artifact
        when: 'false'

  # ────────────────────────────────────────────────────────────────────────────
  # SIDECAR TEST GROUPS — DinD pattern
  # include: dind on the task starts the Docker daemon.
  # include: docker-socket on the step mounts /var/run/docker.sock.
  # All services started with --network host so they're on 127.0.0.1.
  # Docker CLI is not in node:24 — installed via apt in each task.
  # ────────────────────────────────────────────────────────────────────────────

  # ── Shared DinD setup script ─────────────────────────────────────────────────
  # (inlined into every sidecar task — SPS has no shared include scripts)

  # ── collector redis (Tekton tasks 1-20) ─────────────────────────────────────
  # Each task gets 1/20th of the collector test suite (CI_TEST_SPLIT=39,
  # CI_TEST_SPLIT_CURRENT=1..20) using redis/ioredis sidecars.
  # Mirrored from collector-1-redis-task.yaml .. collector-20-redis-task.yaml

  collector-redis-tests:
    from: code-build
    displayName: collector-redis-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-redis-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # ── Install Docker CLI ───────────────────────────────────────────────
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start Redis primary ──────────────────────────────────────────────
          docker run -d --network host --name redis \
            public.ecr.aws/docker/library/redis:7.4.3

          # ── Start Redis replica ──────────────────────────────────────────────
          docker run -d --network host --name redis-slave \
            public.ecr.aws/docker/library/redis:7.4.3 \
            redis-server --replicaof 127.0.0.1 6379 --port 6380

          # ── Start Redis Sentinel ─────────────────────────────────────────────
          docker run -d --network host --name redis-sentinel \
            public.ecr.aws/docker/library/redis:7.4.3 sh -c '
              echo "sentinel monitor mymaster 127.0.0.1 6379 2"          > /etc/sentinel.conf
              echo "sentinel down-after-milliseconds mymaster 1000"      >> /etc/sentinel.conf
              echo "sentinel failover-timeout mymaster 5000"             >> /etc/sentinel.conf
              echo "sentinel parallel-syncs mymaster 1"                  >> /etc/sentinel.conf
              echo "sentinel resolve-hostnames no"                       >> /etc/sentinel.conf
              redis-server /etc/sentinel.conf --sentinel --port 26379'

          # ── Wait for Redis to be ready ───────────────────────────────────────
          echo "Waiting for Redis primary..."
          timeout 30 bash -c \
            'until docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done'
          echo "Redis ready."

          export CI=true

          # ── Fetch Azure Redis cluster credentials from IBM Secrets Manager ────
          # Hostname is static; password fetched via ibmcloud sm (same as Tekton).
          export AZURE_REDIS_CLUSTER="team-nodejs-redis-cluster-tekton.redis.cache.windows.net:6380"
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud login -a https://cloud.ibm.com -r eu-de --apikey "$IBMCLOUD_API_KEY" -q
          ibmcloud plugin install secrets-manager -f -r 'IBM Cloud' -q
          ibmcloud sm init --service-url "https://2502e0f8-4e08-47d1-bc55-fb1713f22522.private.eu-de.secrets-manager.appdomain.cloud"
          export AZURE_REDIS_CLUSTER_PWD=$(ibmcloud sm secret-value-get \
            --name "AZURE_REDIS_CLUSTER_PWD" \
            --service-name "secret-manager-team-nodejs" \
            --output json | jq -r '.resources[0].secret_data.payload')
          echo "AZURE_REDIS_CLUSTER_PWD set: $([ -n "$AZURE_REDIS_CLUSTER_PWD" ] && echo yes || echo NO)"

          node bin/create-version-test-folders.js

          export TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/databases/redis \
            test/integration/currencies/databases/ioredis \
            'test/integration/currencies/databases/@redis' \
            test/integration/misc/span-batching-with-redis \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'No redis test files found.'
            exit 1
          fi

          echo "Redis test files:"
          echo "$TEST_FILES" | tr ' ' '\n'

          # Run the full redis test suite in one SPS task
          # (Tekton split it across 20 parallel tasks — SPS large worker
          #  has enough capacity to run all redis tests in one pass)
          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  # ── collector kafka (Tekton tasks 21-26) ─────────────────────────────────────
  # Zookeeper + Kafka + kafka-topics setup; each task runs 1/6 of collector
  # tests (CI_TEST_SPLIT=39, CI_TEST_SPLIT_CURRENT=21..26).
  # All 6 splits are consolidated into one SPS task since topic creation
  # only needs to happen once and we run the full kafka subset sequentially.

  collector-kafka-tests:
    from: code-build
    displayName: collector-kafka-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-kafka-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # ── Install Docker CLI ───────────────────────────────────────────────
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start Zookeeper ──────────────────────────────────────────────────
          docker run -d --network host --name zookeeper \
            -e ZOOKEEPER_CLIENT_PORT=2181 \
            public.ecr.aws/aktosecurity/confluentinc-cp-zookeeper:7.9.4-1-ubi8

          # ── Wait for Zookeeper ───────────────────────────────────────────────
          echo "Waiting for Zookeeper..."
          timeout 60 bash -c \
            'until docker exec zookeeper bash -c "echo ruok | nc 127.0.0.1 2181" 2>/dev/null | grep -q imok; do sleep 2; done'
          echo "Zookeeper ready."

          # ── Start Kafka ──────────────────────────────────────────────────────
          docker run -d --network host --name kafka \
            -e KAFKA_BROKER_ID=1 \
            -e KAFKA_ZOOKEEPER_CONNECT=localhost:2181 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:29092,EXTERNAL://localhost:9092 \
            -e KAFKA_LISTENERS=EXTERNAL://:9092,PLAINTEXT://:29092 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_DEFAULT_REPLICATION_FACTOR=1 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,EXTERNAL:PLAINTEXT \
            public.ecr.aws/aktosecurity/confluentinc-cp-kafka:7.9.4-1-ubi8

          # ── Wait for Kafka ───────────────────────────────────────────────────
          echo "Waiting for Kafka broker..."
          timeout 120 bash -c \
            'until docker exec kafka kafka-topics --bootstrap-server 0.0.0.0:9092 --list >/dev/null 2>&1; do sleep 2; done'
          echo "Kafka ready."

          # ── Create required topics ───────────────────────────────────────────
          for TOPIC in test test-topic test-batch-topic rdkafka-topic confluent-kafka-topic; do
            docker exec kafka kafka-topics --bootstrap-server 0.0.0.0:9092 \
              --create --if-not-exists --topic "$TOPIC"
          done
          echo "Kafka topics created."

          export CI=true
          node bin/create-version-test-folders.js

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  # ── collector postgres (Tekton tasks 27-29) ───────────────────────────────────
  collector-postgres-tests:
    from: code-build
    displayName: collector-postgres-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-postgres-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # ── Install Docker CLI ───────────────────────────────────────────────
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start PostgreSQL ─────────────────────────────────────────────────
          docker run -d --network host --name postgres \
            -e POSTGRES_USER=node \
            -e POSTGRES_PASSWORD=nodepw \
            -e POSTGRES_DB=nodedb \
            public.ecr.aws/docker/library/postgres:15.15

          # ── Wait for PostgreSQL ──────────────────────────────────────────────
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c \
            'until docker exec postgres pg_isready --host 127.0.0.1 --port 5432 --dbname=nodedb 2>/dev/null; do sleep 2; done'
          echo "PostgreSQL ready."

          export CI=true
          node bin/create-version-test-folders.js

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  # ── collector elasticsearch (Tekton tasks 30-31) ─────────────────────────────
  collector-elasticsearch-tests:
    from: code-build
    displayName: collector-elasticsearch-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-elasticsearch-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # ── Install Docker CLI ───────────────────────────────────────────────
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start Elasticsearch ──────────────────────────────────────────────
          # vm.max_map_count must be set for ES; on DinD host this is the VM itself
          docker run -d --network host --name elasticsearch \
            -e discovery.type=single-node \
            -e ES_JAVA_OPTS="-Xms500m -Xmx500m" \
            -e xpack.security.enabled=false \
            public.ecr.aws/elastic/elasticsearch:9.0.0

          # ── Wait for Elasticsearch ───────────────────────────────────────────
          echo "Waiting for Elasticsearch..."
          timeout 120 bash -c \
            'until curl -sf http://127.0.0.1:9200/_cluster/health 2>/dev/null; do sleep 3; done'
          echo "Elasticsearch ready."

          export CI=true
          node bin/create-version-test-folders.js

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  # ── collector mongodb (Tekton task 32) ───────────────────────────────────────
  collector-mongodb-tests:
    from: code-build
    displayName: collector-mongodb-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-mongodb-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # ── Install Docker CLI ───────────────────────────────────────────────
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start MongoDB ────────────────────────────────────────────────────
          docker run -d --network host --name mongodb \
            public.ecr.aws/docker/library/mongo:8.0.8

          # ── Wait for MongoDB ─────────────────────────────────────────────────
          echo "Waiting for MongoDB..."
          timeout 60 bash -c \
            'until docker exec mongodb mongosh --eval "db.adminCommand(\"ping\")" 2>/dev/null | grep -q '"'"'ok'"'"'; do sleep 2; done'
          echo "MongoDB ready."

          export CI=true
          node bin/create-version-test-folders.js

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  # ── collector couchbase (Tekton task 33) ─────────────────────────────────────
  collector-couchbase-tests:
    from: code-build
    displayName: collector-couchbase-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-couchbase-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # ── Install Docker CLI ───────────────────────────────────────────────
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start Couchbase ──────────────────────────────────────────────────
          docker run -d --network host --name couchbase \
            public.ecr.aws/docker/library/couchbase:7.6.7

          # ── Wait for Couchbase UI (port 8091) ────────────────────────────────
          echo "Waiting for Couchbase..."
          timeout 90 bash -c \
