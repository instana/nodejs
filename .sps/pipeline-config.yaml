  collector-redis-tests:
    from: code-build
    displayName: collector-redis-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-redis-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli

          # Start Redis primary, slave, and sentinel
          docker run -d --network host --name redis public.ecr.aws/docker/library/redis:7.4.3
          docker run -d --network host --name redis-slave public.ecr.aws/docker/library/redis:7.4.3 redis-server --replicaof 127.0.0.1 6379 --port 6380
          docker run -d --network host --name redis-sentinel public.ecr.aws/docker/library/redis:7.4.3 sh -c '
            echo "sentinel monitor mymaster 127.0.0.1 6379 2" > /etc/sentinel.conf
            echo "sentinel down-after-milliseconds mymaster 1000" >> /etc/sentinel.conf
            echo "sentinel failover-timeout mymaster 5000" >> /etc/sentinel.conf
            echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf
            echo "sentinel resolve-hostnames no" >> /etc/sentinel.conf
            redis-server /etc/sentinel.conf --sentinel --port 26379'

          timeout 30 bash -c 'until docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done'

          export CI=true
          # Redis Cluster Credentials (Temporarily Disabled)
          # export AZURE_REDIS_CLUSTER="${AZURE_REDIS_CLUSTER:-$(get_env azure-redis-cluster "$(get_env AZURE_REDIS_CLUSTER "")")}"
          # export AZURE_REDIS_CLUSTER_PWD="${AZURE_REDIS_CLUSTER_PWD:-$(get_env azure-redis-cluster-pwd "$(get_env AZURE_REDIS_CLUSTER_PWD "")")}"

          node bin/create-version-test-folders.js

          export TEST_FILES
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/databases/redis \
            test/integration/currencies/databases/ioredis \
            'test/integration/currencies/databases/@redis' \
            test/integration/misc/span-batching-with-redis \
            test/integration/currencies/messaging/bull \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            -not -path '*/cluster/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'ERROR: No redis test files found.'
            exit 1
          fi

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  collector-kafka-tests:
    from: code-build
    displayName: collector-kafka-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-kafka-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg netcat-openbsd
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli

          docker run -d --network host --name zookeeper -e ZOOKEEPER_CLIENT_PORT=2181 public.ecr.aws/aktosecurity/confluentinc-cp-zookeeper:7.9.4-1-ubi8
          timeout 60 bash -c 'until nc -z 127.0.0.1 2181; do sleep 2; done'

          docker run -d --network host --name kafka \
            -e KAFKA_BROKER_ID=1 \
            -e KAFKA_ZOOKEEPER_CONNECT=localhost:2181 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:29092,EXTERNAL://localhost:9092 \
            -e KAFKA_LISTENERS=EXTERNAL://:9092,PLAINTEXT://:29092 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_DEFAULT_REPLICATION_FACTOR=1 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,EXTERNAL:PLAINTEXT \
            public.ecr.aws/aktosecurity/confluentinc-cp-kafka:7.9.4-1-ubi8

          timeout 120 bash -c 'until docker exec kafka kafka-topics --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1; do sleep 2; done'

          for TOPIC in test test-topic test-batch-topic rdkafka-topic confluent-kafka-topic; do
            docker exec kafka kafka-topics --bootstrap-server 127.0.0.1:9092 --create --if-not-exists --topic "$TOPIC"
          done

          export CI=true
          node bin/create-version-test-folders.js

          export TEST_FILES
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/messaging/@confluentinc \
            test/integration/currencies/messaging/kafka-node \
            test/integration/currencies/messaging/kafkajs \
            test/integration/currencies/messaging/node-rdkafka \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No kafka test files found — skipping.'
            exit 0
          fi

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  collector-postgres-tests:
    from: code-build
    displayName: collector-postgres-tests
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: collector-postgres-tests
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli

          POSTGRES_PASSWORD=nodepw # pragma: allowlist secret
          docker run -d --network host --name postgres \
            -e POSTGRES_USER=node \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB=nodedb \
            public.ecr.aws/docker/library/postgres:15.15

          timeout 60 bash -c 'until docker exec postgres pg_isready --host 127.0.0.1 --port 5432 --dbname=nodedb 2>/dev/null; do sleep 2; done'

          MYSQL_ROOT_PASSWORD=nodepw # pragma: allowlist secret
          MYSQL_PASSWORD=nodepw # pragma: allowlist secret
          docker run -d --network host --name mysql \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE=nodedb \
            -e MYSQL_USER=node \
            -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            -e MYSQL_ROOT_HOST=0.0.0.0 \
            public.ecr.aws/docker/library/mysql:8.0.26 \
            --default-authentication-plugin=mysql_native_password

          timeout 90 bash -c 'until docker exec mysql sh -c "mysql -h 0.0.0.0 -u node -pnodepw -e \"SELECT 1\"" 2>/dev/null; do sleep 3; done'

          export INSTANA_CONNECT_MYSQL_HOST=127.0.0.1
          export INSTANA_CONNECT_MYSQL_PORT=3306
          export INSTANA_CONNECT_MYSQL_USER=node
          export INSTANA_CONNECT_MYSQL_PW=nodepw
          export INSTANA_CONNECT_MYSQL_DB=nodedb

          export CI=true
          # Azure SQL / Tedious Credentials (Temporarily Disabled)
          # export AZURE_SQL_PWD="${AZURE_SQL_PWD:-$(get_env azure-sql-pwd "$(get_env AZURE_SQL_PWD "")")}"
          # export AZURE_SQL_USERNAME="admin@instana@nodejs-team-db-server"
          # export AZURE_SQL_SERVER="nodejs-team-db-server.database.windows.net"
          # export AZURE_SQL_DATABASE="azure-nodejs-test"

          node bin/create-version-test-folders.js

          export TEST_FILES
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/databases/pg \
            test/integration/currencies/databases/pg-native \
            test/integration/currencies/databases/prisma \
            test/integration/currencies/databases/sequelize \
            test/integration/currencies/frameworks/sequelize \
            test/integration/currencies/frameworks/typeorm \
            test/integration/currencies/frameworks/restify \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No postgres/tedious test files found — skipping.'
            exit 0
          fi

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

  collector-elasticsearch-tests:
