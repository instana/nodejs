          timeout 120 bash -c 'until curl -sf http://127.0.0.1:4566/_localstack/health 2>/dev/null | grep -q running; do sleep 3; done'

          export CI=true
          CI_TEST_SPLIT=5 CI_TEST_SPLIT_CURRENT=4 npm run test:ci:aws-lambda
      - name: sign-artifact
        when: 'false'

  aws-lambda-tests-5:
    from: code-build
    displayName: aws-lambda-tests-5
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: build-artifact
        displayName: aws-lambda-tests-5
        image: public.ecr.aws/docker/library/node:24
        include:
          - docker-socket
        script: |
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli

          docker run -d --network host --name localstack public.ecr.aws/localstack/localstack:4.5
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:4566/_localstack/health 2>/dev/null | grep -q running; do sleep 3; done'

          export CI=true
          CI_TEST_SPLIT=5 CI_TEST_SPLIT_CURRENT=5 npm run test:ci:aws-lambda
      - name: sign-artifact
        when: 'false'

