          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian ${CODENAME} stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          docker version

          # ── Start Oracle DB Free 23c ─────────────────────────────────────────
          docker run -d --network host --name oracledb \
            -e ORACLE_PWD=teamnodejspassword \ # pragma: allowlist secret
            container-registry.oracle.com/database/free:23.6.0.0-lite

          # ── Wait for Oracle listener (port 1521) ─────────────────────────────
          echo "Waiting for Oracle DB (this takes ~90s)..."
          timeout 180 bash -c \
            'until docker exec oracledb bash -c "echo exit | sqlplus -L system/teamnodejspassword@//localhost:1521/FREE" 2>&1 | grep -q "Connected to"; do sleep 5; done' # pragma: allowlist secret
          echo "Oracle DB ready."

          export CI=true
          node bin/create-version-test-folders.js

          # ── Scope tests to this service's directories ───────────────────────
          export TEST_FILES
          TEST_FILES=$(cd packages/collector && find \
            test/integration/currencies/databases/oracledb \
            -name '*.test.js' \
            -not -path '*/node_modules/*' \
            | sort | tr '\n' ' ')

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No oracledb test files found — skipping.'
            exit 0
          fi

          echo "oracledb test files ($(echo "$TEST_FILES" | wc -w | xargs) files):"
          echo "$TEST_FILES" | tr ' ' '\n'

          npm run test:ci:collector
      - name: sign-artifact
        when: 'false'

