version: '2'
tasks:
  pr-code-checks:
    steps:
      - name: run-stage
        when: 'false'
  pr-code-build:
    runtimeClassName: large
    steps:
      - name: build-artifact
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: sign-artifact
        when: 'false'
  pr-code-build-aws-fargate:
    from: pr-code-build
    displayName: aws-fargate
    runtimeClassName: large
    steps:
      - name: build-artifact
        displayName: aws-fargate
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          exec env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            CI=true \
            npm run test:ci:aws-fargate
      - name: sign-artifact
        when: 'false'
  app-preview-pr-finish:
    steps:
      - name: run-stage
        when: 'false'
