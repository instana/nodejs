          #!/usr/bin/env bash
          set -eo pipefail

          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          REPO_DIR="$WORKSPACE/$(load_repo app-repo path)"
          cd "$REPO_DIR"

          # install docker client
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg netcat-openbsd socat
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          # start network-filter sidecar
          FILTER_CTR="network-filter-google-cloud-run-$$"
          cleanup() {
            docker rm -f "$FILTER_CTR" 2>/dev/null || true
          }
          trap cleanup EXIT

          ALLOWED_DOMAINS="registry.npmjs.org,registry.npmjs.com,npmjs.org,npmjs.com,raw.githubusercontent.com,github.com,objects.githubusercontent.com,nodejs.org"

          docker run --detach --name "$FILTER_CTR" \
            --cap-add NET_ADMIN \
            --env ALLOWED_DOMAINS="$ALLOWED_DOMAINS" \
            mirror.gcr.io/monadicalsas/network-filter:latest

          elapsed=0
          until docker logs "$FILTER_CTR" 2>&1 | grep -qi "iptables"; do
            elapsed=$((elapsed + 1))
            if [ "$elapsed" -ge 30 ]; then
              echo "ERROR: network-filter did not become ready within 30s"
              docker logs "$FILTER_CTR" 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          echo "network-filter ready after ${elapsed}s"

          NODE_MAJOR="${node_version%%.*}"
          NODE_IMAGE="mirror.gcr.io/library/node:${NODE_MAJOR:-24}"

          echo "Running npm install & test folder setup inside filtered container..."
          docker run --rm \
            --network "container:${FILTER_CTR}" \
            --volume "$REPO_DIR:/work" \
            --workdir /work \
            "$NODE_IMAGE" \
            bash -c "npm install --loglevel warn --foreground-scripts && node bin/create-version-test-folders.js"

          # collect test files
          TEST_FILES=$(cd packages/google-cloud-run && find test -name '*test.js' -not -path '*/node_modules/*' | sort | tr '\n' ' ')

          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            docker run --rm \
              --network "container:${FILTER_CTR}" \
              --volume "$REPO_DIR:/work" \
              --workdir /work \
              --env CI=true \
              --env TEST_FILES="$TEST_FILES" \
              "$NODE_IMAGE" \
              npm run coverage-ci --npm_command="test:ci:google-cloud-run" --report_dir="google-cloud-run" || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done
          # Cleanup filter container so host has direct connectivity for uploads
          cleanup
          trap - EXIT


          # upload executed test files + lcov coverage report to COS
          COS_API_KEY="$(get_secret ibm-object-storage-api-key)"
          GIT_COMMIT="$(get_env commit-id "")"
          if [ -n "$COS_API_KEY" ] && [ -n "$GIT_COMMIT" ]; then
            IAM_TOKEN=$(curl -sf -X POST "https://iam.cloud.ibm.com/identity/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=$COS_API_KEY" \
              | grep -o '"access_token":"[^"]*"' | sed 's/"access_token":"//;s/"//')
            curl -sf -X PUT \
              "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/google-cloud-run.txt" \
              -H "Authorization: Bearer $IAM_TOKEN" \
              -H "Content-Type: text/plain" \
              --data-binary "$(echo "$TEST_FILES" | tr ' ' '\n' | sort)" \
              && echo "Uploaded test list for google-cloud-run → test-results/$GIT_COMMIT/google-cloud-run.txt" \
              || echo "WARNING: Failed to upload test list for google-cloud-run (non-fatal)"
            NODE_MAJOR="${node_version%%.*}"
            if [ "$NODE_MAJOR" != "24" ]; then
              echo "Skip: lcov upload — not the development node major version ($NODE_MAJOR != 24)"
            else
              LCOV_FILE="coverage/google-cloud-run/lcov.info"
              if [ -f "$LCOV_FILE" ]; then
                curl -sf -X PUT \
                  "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/coverage/google-cloud-run/lcov.info" \
                  -H "Authorization: Bearer $IAM_TOKEN" \
                  -H "Content-Type: text/plain" \
                  --data-binary @"$LCOV_FILE" \
                  && echo "Uploaded lcov for google-cloud-run → test-results/$GIT_COMMIT/coverage/google-cloud-run/lcov.info" \
                  || echo "WARNING: Failed to upload lcov for google-cloud-run (non-fatal)"
              else
                echo "WARNING: lcov not found at $LCOV_FILE — skipping lcov upload"
              fi
            fi
          else
            echo "WARNING: COS credentials or git commit unavailable — skipping uploads"
          fi


          # report commit status to GitHub
          GH_TOKEN="$(get_secret gh-public-token)"
          GIT_COMMIT="$(get_env commit-id "${COMMIT_SHA:-}")"
          PIPELINE_RUN_URL="$(get_env PIPELINE_RUN_URL "")"
          if [ -n "$GIT_COMMIT" ]; then
            STATUS="success"
            if [ $LAST_EXIT -ne 0 ]; then STATUS="failure"; fi
            CURL_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "https://api.github.com/repos/instana/nodejs/statuses/$GIT_COMMIT" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "{\"state\":\"$STATUS\",\"target_url\":\"$PIPELINE_RUN_URL\",\"description\":\"Main pipeline $STATUS (Node ${node_version%%.*})\",\"context\":\"sps/main/$TASK_NAME\"}")
            CURL_HTTP=$(echo "$CURL_RESPONSE" | tail -1)
            CURL_BODY=$(echo "$CURL_RESPONSE" | sed '$d')
            if [ "$CURL_HTTP" = "201" ]; then
              echo "Commit status set to '$STATUS' for $GIT_COMMIT."
            else
              echo "WARNING: Failed to set commit status (non-fatal). HTTP $CURL_HTTP: $CURL_BODY"
            fi
          else
            echo "WARNING: commit-id not set — skipping commit status."
          fi
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
