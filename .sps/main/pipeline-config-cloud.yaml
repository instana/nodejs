version: '2'
tasks:
  code-build:
    displayName: setup
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-pr-finish:
    steps:
      - name: run-stage
        when: 'false'
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
  deploy-checks:
    when: false
  deploy-release:
    when: false
  code-build-aws-lambda:
    from: code-build
    displayName: aws-lambda
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: aws-lambda
        image: mirror.gcr.io/library/node:24
        include:
          - docker-socket
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # collect test files
          TEST_FILES=$(cd packages/aws-lambda && find test -name '*test.js' -not -path '*/node_modules/*' | sort | tr '\n' ' ')

          # install docker client
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg netcat-openbsd socat
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          # create isolated network (no internet access)
          docker network create --internal offline-net

          # start localstack
          docker run -d --network offline-net --name localstack \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "mirror.gcr.io/localstack/localstack:4.5"
          SIDECAR_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' localstack)
          socat TCP-LISTEN:4566,fork,reuseaddr,bind=127.0.0.1 TCP:$SIDECAR_IP:4566 &
          timeout 60 bash -c \
            'until nc -z 127.0.0.1 4566 2>/dev/null; do sleep 2; done'

          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              CI=true \
              INSTANA_CONNECT_LOCALSTACK_AWS="http://127.0.0.1:4566" \
              npm run coverage-ci --npm_command="test:ci:aws-lambda" --report_dir="aws-lambda" || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done

          # upload executed test files + lcov coverage report to COS
          COS_API_KEY="$(get_secret ibm-object-storage-api-key)"
          GIT_COMMIT="$(get_env HEAD_SHA "")"
          if [ -n "$COS_API_KEY" ] && [ -n "$GIT_COMMIT" ]; then
            IAM_TOKEN=$(curl -sf -X POST "https://iam.cloud.ibm.com/identity/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=$COS_API_KEY" \
              | grep -o '"access_token":"[^"]*"' | sed 's/"access_token":"//;s/"//')
            curl -sf -X PUT \
              "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/aws-lambda.txt" \
              -H "Authorization: Bearer $IAM_TOKEN" \
              -H "Content-Type: text/plain" \
              --data-binary "$(echo "$TEST_FILES" | tr ' ' '\n' | sort)" \
              && echo "Uploaded test list for aws-lambda → test-results/$GIT_COMMIT/aws-lambda.txt" \
              || echo "WARNING: Failed to upload test list for aws-lambda (non-fatal)"
            LCOV_FILE="coverage/aws-lambda/lcov.info"
            if [ -f "$LCOV_FILE" ]; then
              curl -sf -X PUT \
                "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/coverage/aws-lambda/lcov.info" \
                -H "Authorization: Bearer $IAM_TOKEN" \
                -H "Content-Type: text/plain" \
                --data-binary @"$LCOV_FILE" \
                && echo "Uploaded lcov for aws-lambda → test-results/$GIT_COMMIT/coverage/aws-lambda/lcov.info" \
                || echo "WARNING: Failed to upload lcov for aws-lambda (non-fatal)"
            else
              echo "WARNING: lcov not found at $LCOV_FILE — skipping lcov upload"
            fi
          else
            echo "WARNING: COS credentials or git commit unavailable — skipping uploads"
          fi

          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
