version: '2'
tasks:
  code-build:
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="$(get_env node-version 2>/dev/null || true)"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version" --no-progress
            nvm use "$node_version"
            ACTUAL=$(node --version)
            if [[ "$ACTUAL" != "v${node_version}"* ]]; then
              echo "ERROR: expected Node.js v${node_version} but got ${ACTUAL}"
              exit 1
            fi
          fi
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-pr-finish:
    steps:
      - name: run-stage
        when: 'false'
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
  deploy-checks:
    when: false
  deploy-release:
    when: false
  code-build-opentelemetry-exporter:
    from: code-build
    displayName: opentelemetry-exporter
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: opentelemetry-exporter
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="$(get_env node-version 2>/dev/null || true)"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version" --no-progress
            nvm use "$node_version"
            ACTUAL=$(node --version)
            if [[ "$ACTUAL" != "v${node_version}"* ]]; then
              echo "ERROR: expected Node.js v${node_version} but got ${ACTUAL}"
              exit 1
            fi
          fi
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              CI=true \
              npm run test:ci:opentelemetry-exporter || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-build-opentelemetry-sampler:
    from: code-build
    displayName: opentelemetry-sampler
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: opentelemetry-sampler
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="$(get_env node-version 2>/dev/null || true)"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version" --no-progress
            nvm use "$node_version"
            ACTUAL=$(node --version)
            if [[ "$ACTUAL" != "v${node_version}"* ]]; then
              echo "ERROR: expected Node.js v${node_version} but got ${ACTUAL}"
              exit 1
            fi
          fi
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              CI=true \
              npm run test:ci:opentelemetry-sampler || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
