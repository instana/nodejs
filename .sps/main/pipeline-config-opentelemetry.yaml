version: '2'
tasks:
  code-build:
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-pr-finish:
    when: 'false'
  code-ci-finish:
    when: 'false'
  deploy-checks:
    when: false
  deploy-release:
    when: false
  code-build-opentelemetry-exporter:
    from: code-build
    displayName: opentelemetry-exporter
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: opentelemetry-exporter
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          # collect test files
          TEST_FILES=$(cd packages/opentelemetry-exporter && find test -name '*test.js' -not -path '*/node_modules/*' | sort | tr '\n' ' ')

          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              CI=true \
              npm run coverage-ci --npm_command="test:ci:opentelemetry-exporter" --report_dir="opentelemetry-exporter" || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done

          # upload executed test files + lcov coverage report to COS
          COS_API_KEY="$(get_secret ibm-object-storage-api-key)"
          GIT_COMMIT="$(get_env commit-id "")"
          if [ -n "$COS_API_KEY" ] && [ -n "$GIT_COMMIT" ]; then
            IAM_TOKEN=$(curl -sf -X POST "https://iam.cloud.ibm.com/identity/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=$COS_API_KEY" \
              | grep -o '"access_token":"[^"]*"' | sed 's/"access_token":"//;s/"//')
            curl -sf -X PUT \
              "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/opentelemetry-exporter.txt" \
              -H "Authorization: Bearer $IAM_TOKEN" \
              -H "Content-Type: text/plain" \
              --data-binary "$(echo "$TEST_FILES" | tr ' ' '\n' | sort)" \
              && echo "Uploaded test list for opentelemetry-exporter → test-results/$GIT_COMMIT/opentelemetry-exporter.txt" \
              || echo "WARNING: Failed to upload test list for opentelemetry-exporter (non-fatal)"
            NODE_MAJOR="${node_version%%.*}"
            if [ "$NODE_MAJOR" != "24" ]; then
              echo "Skip: lcov upload — not the development node major version ($NODE_MAJOR != 24)"
            else
              LCOV_FILE="coverage/opentelemetry-exporter/lcov.info"
              if [ -f "$LCOV_FILE" ]; then
                curl -sf -X PUT \
                  "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/coverage/opentelemetry-exporter/lcov.info" \
                  -H "Authorization: Bearer $IAM_TOKEN" \
                  -H "Content-Type: text/plain" \
                  --data-binary @"$LCOV_FILE" \
                  && echo "Uploaded lcov for opentelemetry-exporter → test-results/$GIT_COMMIT/coverage/opentelemetry-exporter/lcov.info" \
                  || echo "WARNING: Failed to upload lcov for opentelemetry-exporter (non-fatal)"
              else
                echo "WARNING: lcov not found at $LCOV_FILE — skipping lcov upload"
              fi
            fi
          else
            echo "WARNING: COS credentials or git commit unavailable — skipping uploads"
          fi


          # report commit status to GitHub
          echo "DEBUG: all pipeline envs:"; env | cut -d= -f1 | sort
          GH_TOKEN="$(get_secret git-token)"
          GIT_COMMIT="$(get_env commit-id "")"
          PIPELINE_RUN_URL="$(get_env PIPELINE_RUN_URL "")"
          if [ -n "$GIT_COMMIT" ]; then
            STATUS="success"
            if [ $LAST_EXIT -ne 0 ]; then STATUS="failure"; fi
            curl -sf -o /dev/null \
              -X POST "https://github.ibm.com/api/v3/repos/instana/nodejs/statuses/$GIT_COMMIT" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"state\":\"$STATUS\",\"target_url\":\"$PIPELINE_RUN_URL\",\"description\":\"Main pipeline $STATUS (Node ${node_version%%.*})\",\"context\":\"sps/main\"}" \
              && echo "Commit status set to '$STATUS' for $GIT_COMMIT." \
              || echo "WARNING: Failed to set commit status (non-fatal)."
          else
            echo "WARNING: commit-id not set — skipping commit status."
          fi
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
