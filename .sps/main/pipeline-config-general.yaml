            fi
          else
            echo "WARNING: commit-id not set — skipping commit status."
          fi
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
