version: '2'
tasks:
# code-checks is skipped intentionally — this checks runs on dedicated security-check pipe only.
# code-checks includes five steps: setup, detect-secrets, compliance-checks, peer-review, static-scan
  code-checks:
    when: false
  code-build:
    runtimeClassName: large
    steps:
      - name: unit-test
        when: 'false'
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-pr-finish:
    when: 'false'
  code-ci-finish:
    when: 'false'
  deploy-checks:
    when: false
  deploy-release:
    when: false
  code-build-echo-env:
    from: code-build
    displayName: echo-env
    runtimeClassName: large
    steps:
      - name: unit-test
        displayName: echo-env
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          # ── Read trigger parameters ───────────────────────────────────────────────
          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          RUN_ESM="$(get_env RUN_ESM "")"

          echo "Trigger params:"
          echo "  node-version = ${node_version}"
          echo "  RUN_ESM      = ${RUN_ESM:-<not set>}"
          echo ""

          # ── Switch to the requested Node version via nvm ──────────────────────────
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"

          cd "$WORKSPACE/$(load_repo app-repo path)"

          # ── Runtime versions ──────────────────────────────────────────────────────
          echo "Using node:    $(node --version 2>/dev/null || echo 'Node.js not found')"
          echo "Using npm:     $(npm --version 2>/dev/null || echo 'NPM not found')"
          echo "Architecture:  $(node -p 'process.arch' 2>/dev/null || echo 'Unknown')"

          # ── ESM support ───────────────────────────────────────────────────────────
          if [ -n "$RUN_ESM" ] && [ "$RUN_ESM" = "true" ]; then
            echo "ESM mode:      enabled (RUN_ESM=true)"
          else
            echo "ESM mode:      disabled (RUN_ESM not set)"
          fi

          echo "Python3 version: $(python3 --version 2>/dev/null | head -n 1 || echo 'Python3 not found')"
          echo "Make version:    $(make --version 2>/dev/null | head -n 1 || echo 'Make not found')"
          echo "GCC version:     $(gcc --version 2>/dev/null | head -n 1 || echo 'GCC not found')"
          echo "Node-gyp:        $(node-gyp --version 2>/dev/null || echo 'Node-gyp not found')"
          echo ""
          echo "NPM config list:"
          LAST_EXIT=0
          npm config list || LAST_EXIT=$?

          # report commit status to GitHub
          GH_TOKEN="$(get_secret gh-public-token)"
          GIT_COMMIT="$(get_env commit-id "${COMMIT_SHA:-}")"
          PIPELINE_RUN_URL="$(get_env PIPELINE_RUN_URL "")"
          if [ -n "$GIT_COMMIT" ]; then
            STATUS="success"
            if [ $LAST_EXIT -ne 0 ]; then STATUS="failure"; fi
            CURL_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "https://api.github.com/repos/instana/nodejs/statuses/$GIT_COMMIT" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "{\"state\":\"$STATUS\",\"target_url\":\"$PIPELINE_RUN_URL\",\"description\":\"Main pipeline $STATUS (Node ${node_version%%.*})\",\"context\":\"sps/main/$TASK_NAME\"}")
            CURL_HTTP=$(echo "$CURL_RESPONSE" | tail -1)
            CURL_BODY=$(echo "$CURL_RESPONSE" | sed '$d')
            if [ "$CURL_HTTP" = "201" ]; then
              echo "Commit status set to '$STATUS' for $GIT_COMMIT."
            else
              echo "WARNING: Failed to set commit status (non-fatal). HTTP $CURL_HTTP: $CURL_BODY"
            fi
          else
            echo "WARNING: commit-id not set — skipping commit status."
          fi
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-build-audit:
    from: code-build
