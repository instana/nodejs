version: '2'
tasks:
  code-checks:
    steps:
      - name: setup
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          bash bin/install-npm.sh
          npm install --loglevel warn --ignore-scripts
          node bin/create-version-test-folders.js
  code-build:
    steps:
      - name: unit-test
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          echo "General PR checks passed."
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  sign-artifact:
    when: 'false'
  deploy-checks:
    when: 'false'
  deploy-release:
    when: 'false'
  code-ci-finish:
    when: 'false'
