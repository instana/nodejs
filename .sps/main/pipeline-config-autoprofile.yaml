version: '2'
tasks:
  code-build:
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="$(get_env node-version 2>/dev/null || true)"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version" --no-progress
            nvm use "$node_version"
            ACTUAL=$(node --version)
            if [[ "$ACTUAL" != "v${node_version}"* ]]; then
              echo "ERROR: expected Node.js v${node_version} but got ${ACTUAL}"
              exit 1
            fi
          fi
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
  code-build-autoprofile:
    from: code-build
    displayName: autoprofile
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: autoprofile
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="$(get_env node-version 2>/dev/null || true)"
          if [ -n "${node_version:-}" ]; then
            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$node_version" --no-progress
            nvm use "$node_version"
            ACTUAL=$(node --version)
            if [[ "$ACTUAL" != "v${node_version}"* ]]; then
              echo "ERROR: expected Node.js v${node_version} but got ${ACTUAL}"
              exit 1
            fi
          fi
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          export CI_AUTOPROFILE_TEST_FILES=$(cd packages/autoprofile && find test -name '*.test.js' -not -path '*/node_modules/*' | sort | tr '\n' ' ')

          exec env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            CI=true \
            CI_AUTOPROFILE_TEST_FILES="$CI_AUTOPROFILE_TEST_FILES" \
            npm run test:ci:autoprofile
