version: '2'
tasks:
  code-build:
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: unit-test
        displayName: prod-dependency-bot
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          export GH_TOKEN="$(get_secret gh-public-token)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          git config user.name "Instanacd PAT for GitHub Public"
          git config user.email "instanacd@instana.com"
          git remote set-url origin "https://${GH_TOKEN}@github.com/instana/nodejs.git"

          # Install gh CLI and jq
          mkdir -p -m 755 /etc/apt/keyrings
          wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] \
            https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update -qq && apt-get install -y -qq gh jq

          echo "Running production dependency updates..."
          PROD_DEPS_PR_LIMIT="$(get_env prod-deps-pr-limit "5")" \
          PROD_DEPS_ORG_PR_LIMIT="$(get_env prod-deps-org-pr-limit "10")" \
          PROD_DEPS_SKIP="$(get_env prod-deps-skip "")" \
          BRANCH=build \
          node bin/dependencies/production/update-prod-dependencies.js
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  sign-artifact:
    when: false
  deploy-checks:
    when: false
  deploy-release:
    when: false
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
  code-checks:
    when: false
