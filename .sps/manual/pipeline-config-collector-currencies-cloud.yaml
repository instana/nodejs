              -e HTTP_PROXY="" \
              -e HTTPS_PROXY="" \
              -e http_proxy="" \
              -e https_proxy="" \
              -e RUN_ESM="$RUN_ESM" \
              -e TEST_FILES="$TEST_FILES" \
              test-runner \
              npm run coverage-ci --npm_command="test:ci:collector" --report_dir="collector-cloud-aws-sdk" || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done

          # cleanup
          docker rm -f test-runner npm-proxy || true
          docker network rm npm-net || true


          # upload executed test files + lcov coverage report to COS
          COS_API_KEY="$(get_secret ibm-object-storage-api-key)"
          GIT_COMMIT="$(get_env commit-id "")"
          if [ -n "$COS_API_KEY" ] && [ -n "$GIT_COMMIT" ]; then
            IAM_TOKEN=$(curl -sf -X POST "https://iam.cloud.ibm.com/identity/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=$COS_API_KEY" \
              | grep -o '"access_token":"[^"]*"' | sed 's/"access_token":"//;s/"//')
            curl -sf -X PUT \
              "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/collector-cloud-aws-sdk.txt" \
              -H "Authorization: Bearer $IAM_TOKEN" \
              -H "Content-Type: text/plain" \
              --data-binary "$(echo "$TEST_FILES" | tr ' ' '\n' | sort)" \
              && echo "Uploaded test list for collector-cloud-aws-sdk → test-results/$GIT_COMMIT/collector-cloud-aws-sdk.txt" \
              || echo "WARNING: Failed to upload test list for collector-cloud-aws-sdk (non-fatal)"
            NODE_MAJOR="${node_version%%.*}"
            if [ "$NODE_MAJOR" != "24" ]; then
              echo "Skip: lcov upload — not the development node major version ($NODE_MAJOR != 24)"
            else
              LCOV_FILE="coverage/collector-cloud-aws-sdk/lcov.info"
              if [ -f "$LCOV_FILE" ]; then
                curl -sf -X PUT \
                  "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/coverage/collector-cloud-aws-sdk/lcov.info" \
                  -H "Authorization: Bearer $IAM_TOKEN" \
                  -H "Content-Type: text/plain" \
                  --data-binary @"$LCOV_FILE" \
                  && echo "Uploaded lcov for collector-cloud-aws-sdk → test-results/$GIT_COMMIT/coverage/collector-cloud-aws-sdk/lcov.info" \
                  || echo "WARNING: Failed to upload lcov for collector-cloud-aws-sdk (non-fatal)"
              else
                echo "WARNING: lcov not found at $LCOV_FILE — skipping lcov upload"
              fi
            fi
          else
            echo "WARNING: COS credentials or git commit unavailable — skipping uploads"
          fi


          # report commit status to GitHub
          GH_TOKEN="$(get_secret gh-public-token)"
          GIT_COMMIT="$(get_env commit-id "${COMMIT_SHA:-}")"
          PIPELINE_RUN_URL="$(get_env PIPELINE_RUN_URL "")"
          if [ -n "$GIT_COMMIT" ]; then
            STATUS="success"
            if [ $LAST_EXIT -ne 0 ]; then STATUS="failure"; fi
            CURL_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "https://api.github.com/repos/instana/nodejs/statuses/$GIT_COMMIT" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "{\"state\":\"$STATUS\",\"target_url\":\"$PIPELINE_RUN_URL\",\"description\":\"Main pipeline $STATUS (Node ${node_version%%.*})\",\"context\":\"sps/main/${node_version%%.*}/$TASK_NAME\"}")
            CURL_HTTP=$(echo "$CURL_RESPONSE" | tail -1)
            CURL_BODY=$(echo "$CURL_RESPONSE" | sed '$d')
            if [ "$CURL_HTTP" = "201" ]; then
              echo "Commit status set to '$STATUS' for $GIT_COMMIT."
            else
              echo "WARNING: Failed to set commit status (non-fatal). HTTP $CURL_HTTP: $CURL_BODY"
            fi
          else
            echo "WARNING: commit-id not set — skipping commit status."
          fi
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
