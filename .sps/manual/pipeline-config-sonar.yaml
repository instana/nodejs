version: '2'
tasks:
  code-build:
    steps:
      - name: peer-review
        when: 'false'
      - name: unit-test
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          echo "Sonar checks passed."
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  sign-artifact:
    when: 'false'
  deploy-checks:
    when: 'false'
  deploy-release:
    when: 'false'
  code-ci-finish:
    steps:
      - name: run-stage
        when: 'false'
  sonar-analysis:
    from: code-build
    displayName: sonar-analysis
    runtimeClassName: large
    steps:
      - name: peer-review
        when: 'false'
      - name: detect-secrets
        when: 'false'
      - name: compliance-checks
        when: 'false'
      - name: unit-test
        displayName: sonar-analysis
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          SONAR_TOKEN="$(get_secret sonar-token)"
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: sonar-token pipeline property is not set — skipping Sonar analysis."
            exit 1
          fi

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts

          echo "Running ESLint..."
          npx eslint packages/ -f json -o eslint-report.json || true

          echo "Installing SonarCloud scanner..."
          npm install -g @sonar/scan@4.4.0

          echo "Running main branch Sonar analysis..."
          sonar -Dsonar.token="$SONAR_TOKEN"
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
