version: '2'
tasks:
# code-checks is skipped intentionally — this checks runs on dedicated security-check pipe only.
# code-checks includes five steps: setup, detect-secrets, compliance-checks, peer-review, static-scan
  code-checks:
    when: false
  code-build:
    runtimeClassName: large
    steps:
      - name: unit-test
        displayName: npm-install
        image: mirror.gcr.io/library/node:24
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail
          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "")")}"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          # shellcheck source=/dev/null
          . "$NVM_DIR/nvm.sh"
          nvm install "$node_version" --no-progress
          nvm use "$node_version"
          echo "Node.js: $(node --version)"

          cd "$WORKSPACE/$(load_repo app-repo path)"
          npm install --loglevel warn --foreground-scripts
          node bin/create-version-test-folders.js
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
  code-pr-finish:
    when: 'false'
  code-ci-finish:
    when: 'false'
  deploy-checks:
    when: false
  deploy-release:
    when: false
  code-build-collector-databases-elasticsearch:
    from: code-build
    displayName: '@elastic/elasticsearch'
    runtimeClassName: large
    include:
      - dind
    steps:
      - name: unit-test
        displayName: '@elastic/elasticsearch'
        image: mirror.gcr.io/library/debian:bookworm-slim
        include:
          - docker-socket
        script: |-
          #!/usr/bin/env bash
          set -eo pipefail

          node_version="${node_version:-$(get_env node-version "$(get_env NODE_VERSION "$(cat .nvmrc | tr -d '[:space:]')")")}",
          NODE_MAJOR="${node_version%%.*}"
          RUN_ESM="$(get_env RUN_ESM "")"

          cd "$WORKSPACE/$(load_repo app-repo path)"

          # install docker client
          CODENAME=$(. /etc/os-release; echo "$VERSION_CODENAME")
          ARCH=$(dpkg --print-architecture)
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg netcat-openbsd socat
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${CODENAME} stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq && apt-get install -y -qq docker-ce-cli
          timeout 30 bash -c 'until [ -S /var/run/docker.sock ]; do sleep 1; done'

          REPO_PATH="$PWD"
          NODE_MAJOR="NODE_MAJOR"

          # build Squid egress-proxy image
          docker build -t npm-proxy:local "$REPO_PATH/ci/squid"

          # start proxy + test-runner on a shared network
          # The proxy enforces the allowlist for the entire run.
          # Test execution clears proxy env vars so tests don't route through Squid.
          docker network create npm-net
          docker run -d \
            --name npm-proxy \
            --network npm-net \
            npm-proxy:local
          docker run -d \
            --name test-runner \
            --network npm-net \
            -v "$REPO_PATH:$REPO_PATH" \
            -w "$REPO_PATH" \
            -e CI=true \
            -e RUN_ESM="$RUN_ESM" \
            -e HTTPS_PROXY="http://npm-proxy:3128" \
            -e HTTP_PROXY="http://npm-proxy:3128" \
            -e NO_PROXY="127.0.0.1,localhost" \
            "mirror.gcr.io/library/node:${NODE_MAJOR}" \
            sleep infinity

          docker exec test-runner npm install --loglevel warn
          docker exec test-runner node bin/create-version-test-folders.js

          # collect test files
          TEST_FILES=$(docker exec test-runner \
            bash -c "cd packages/collector && find \
              test/integration/currencies/databases/@elastic/elasticsearch \
              -name '*.test.js' \
              -not -path '*/node_modules/*' \
              | sort | tr '\n' ' '")

          if [ -z "$TEST_FILES" ]; then
            echo 'WARNING: No test files found for @elastic/elasticsearch — skipping.'
            docker rm -f test-runner npm-proxy || true
            docker network rm npm-net || true
            exit 0
          fi

          retry=1
          while [ $retry -le 2 ]; do
            LAST_EXIT=0
            docker exec \
              -e CI=true \
              -e HTTP_PROXY="" \
              -e HTTPS_PROXY="" \
              -e http_proxy="" \
              -e https_proxy="" \
              -e RUN_ESM="$RUN_ESM" \
              -e TEST_FILES="$TEST_FILES" \
              test-runner \
              npm run coverage-ci --npm_command="test:ci:collector" --report_dir="collector-databases-elasticsearch" || LAST_EXIT=$?
            if [ $LAST_EXIT -eq 0 ]; then
              break
            fi
            echo "Attempt $retry failed with exit code $LAST_EXIT — retrying..."
            retry=$((retry + 1))
          done

          # cleanup
          docker rm -f test-runner npm-proxy || true
          docker network rm npm-net || true


          # upload executed test files + lcov coverage report to COS
          COS_API_KEY="$(get_secret ibm-object-storage-api-key)"
          GIT_COMMIT="$(get_env commit-id "")"
          if [ -n "$COS_API_KEY" ] && [ -n "$GIT_COMMIT" ]; then
            IAM_TOKEN=$(curl -sf -X POST "https://iam.cloud.ibm.com/identity/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=$COS_API_KEY" \
              | grep -o '"access_token":"[^"]*"' | sed 's/"access_token":"//;s/"//')
            curl -sf -X PUT \
              "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/collector-databases-elasticsearch.txt" \
              -H "Authorization: Bearer $IAM_TOKEN" \
              -H "Content-Type: text/plain" \
              --data-binary "$(echo "$TEST_FILES" | tr ' ' '\n' | sort)" \
              && echo "Uploaded test list for collector-databases-elasticsearch → test-results/$GIT_COMMIT/collector-databases-elasticsearch.txt" \
              || echo "WARNING: Failed to upload test list for collector-databases-elasticsearch (non-fatal)"
            NODE_MAJOR="${node_version%%.*}"
            if [ "$NODE_MAJOR" != "24" ]; then
              echo "Skip: lcov upload — not the development node major version ($NODE_MAJOR != 24)"
            else
              LCOV_FILE="coverage/collector-databases-elasticsearch/lcov.info"
              if [ -f "$LCOV_FILE" ]; then
                curl -sf -X PUT \
                  "https://s3.eu-de.cloud-object-storage.appdomain.cloud/itp-nodejs-tracer-sps/test-results/$GIT_COMMIT/coverage/collector-databases-elasticsearch/lcov.info" \
                  -H "Authorization: Bearer $IAM_TOKEN" \
                  -H "Content-Type: text/plain" \
                  --data-binary @"$LCOV_FILE" \
                  && echo "Uploaded lcov for collector-databases-elasticsearch → test-results/$GIT_COMMIT/coverage/collector-databases-elasticsearch/lcov.info" \
                  || echo "WARNING: Failed to upload lcov for collector-databases-elasticsearch (non-fatal)"
              else
                echo "WARNING: lcov not found at $LCOV_FILE — skipping lcov upload"
              fi
            fi
          else
            echo "WARNING: COS credentials or git commit unavailable — skipping uploads"
          fi


          # report commit status to GitHub
          GH_TOKEN="$(get_secret gh-public-token)"
          GIT_COMMIT="$(get_env commit-id "${COMMIT_SHA:-}")"
          PIPELINE_RUN_URL="$(get_env PIPELINE_RUN_URL "")"
          if [ -n "$GIT_COMMIT" ]; then
            STATUS="success"
            if [ $LAST_EXIT -ne 0 ]; then STATUS="failure"; fi
            CURL_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "https://api.github.com/repos/instana/nodejs/statuses/$GIT_COMMIT" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "{\"state\":\"$STATUS\",\"target_url\":\"$PIPELINE_RUN_URL\",\"description\":\"Main pipeline $STATUS (Node ${node_version%%.*})\",\"context\":\"sps/main/${node_version%%.*}/$TASK_NAME\"}")
            CURL_HTTP=$(echo "$CURL_RESPONSE" | tail -1)
            CURL_BODY=$(echo "$CURL_RESPONSE" | sed '$d')
            if [ "$CURL_HTTP" = "201" ]; then
              echo "Commit status set to '$STATUS' for $GIT_COMMIT."
            else
              echo "WARNING: Failed to set commit status (non-fatal). HTTP $CURL_HTTP: $CURL_BODY"
            fi
          else
            echo "WARNING: commit-id not set — skipping commit status."
          fi
          exit $LAST_EXIT
      - name: sign-artifact
        when: 'false'
      - name: build-artifact
        when: 'false'
      - name: scan-artifact
        when: 'false'
