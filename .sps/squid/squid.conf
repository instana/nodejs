# ─────────────────────────────────────────────────────────────────────────────
# Squid egress-proxy — strict domain allowlist for CI/CD test-runner isolation
#
# Topology
#   egress-net   → standard bridge with internet access  (Squid outbound NIC)
#   internal-net → --internal bridge, NO internet gateway (test-runner NIC)
#   Squid is dual-homed on both; test-runner reaches internet only via port 3128
# ─────────────────────────────────────────────────────────────────────────────

# ── Network ───────────────────────────────────────────────────────────────────
http_port 3128

# ── ACL — ports ───────────────────────────────────────────────────────────────
acl port_http  port 80
acl port_https port 443

# ── ACL — allowed domains (HTTP GET + HTTPS CONNECT) ─────────────────────────
acl allowed_domains dstdomain \
  .npmjs.org \
  .npmjs.com \
  raw.githubusercontent.com \
  nodejs.org \
  api.github.com \
  iam.cloud.ibm.com \
  s3.eu-de.cloud-object-storage.appdomain.cloud

# ── ACL — request methods ─────────────────────────────────────────────────────
acl method_connect method CONNECT
acl method_safe    method GET HEAD OPTIONS

# ── Access rules ──────────────────────────────────────────────────────────────
# Allow CONNECT (HTTPS tunnelling) only to port 443 on allowed domains.
http_access allow method_connect port_https allowed_domains

# Allow plain HTTP GET/HEAD/OPTIONS only to port 80 on allowed domains.
http_access allow method_safe    port_http  allowed_domains

# Deny everything else — produces a 403 Forbidden to the client.
http_access deny all

# ── Logging → stdout / stderr ─────────────────────────────────────────────────
# Squid writes access log to fd 1 and cache log to fd 2 so Docker captures
# both streams without a separate log-scraping sidecar.
logformat squid %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt
access_log  stdio:/dev/stdout squid
cache_log   stdio:/dev/stderr
cache_store_log none

# ── Cache — disabled (forward-proxy only) ────────────────────────────────────
cache deny all
# No disk cache; keep a tiny memory cache only to satisfy Squid internals.
cache_mem 8 MB
maximum_object_size 0 KB

# ── Process / permissions ─────────────────────────────────────────────────────
# Run as the non-root "proxy" user that exists in the base Debian image.
# The entrypoint must not drop privileges with -N if it already starts non-root,
# but we keep cache_effective_user for explicit documentation.
cache_effective_user  proxy
cache_effective_group proxy

# ── PID file — write to a directory owned by "proxy" ─────────────────────────
pid_filename /var/run/squid/squid.pid

# ── Misc hardening ────────────────────────────────────────────────────────────
# Do not expose internal IP addresses in Via/X-Forwarded-For headers.
forwarded_for delete
via off

# ── Tuning ────────────────────────────────────────────────────────────────────
# Keep connection overhead low inside the CI network.
connect_timeout  30 seconds
read_timeout    120 seconds
request_timeout 120 seconds
