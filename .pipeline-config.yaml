version: '2'

tasks:
  # Skip all compliance checks
  code-checks:
    steps:
      - name: detect-secrets
        when: false
      - name: compliance-checks
        when: false
      - name: peer-review
        when: false
      - name: static-scan
        when: false

  code-build:
    steps:
      - name: unit-test
        displayName: npm-install
        image: public.ecr.aws/docker/library/node:24
        script: |
          #!/bin/bash
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          npm install --loglevel warn --foreground-scripts
          echo "npm install done."
      - name: build-artifact
        when: false
      - name: unit-test
        when: false
      - name: scan-artifact
        when: false
      - name: sign-artifact
        when: false

  # Skip deploy stages
  deploy-checks:
    when: false

  deploy-release:
    when: false
