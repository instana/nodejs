# Define target domains (leading dot covers all subdomains and the apex)
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .npmjs.com
acl allowed_domains dstdomain raw.githubusercontent.com
acl allowed_domains dstdomain nodejs.org
acl allowed_domains dstdomain .nodejs.org
acl allowed_domains dstdomain api.github.com
acl allowed_domains dstdomain iam.cloud.ibm.com
acl allowed_domains dstdomain s3.eu-de.cloud-object-storage.appdomain.cloud

# Define ports and methods
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Deny requests to unsafe ports
http_access deny !Safe_ports

# Allow CONNECT tunnels only to SSL_ports on allowed domains
http_access allow CONNECT allowed_domains SSL_ports

# Allow standard HTTP requests to allowed domains (port 80)
http_access allow allowed_domains Safe_ports

# Deny all other access
http_access deny all

# Bind address and port
http_port 3128

# Disable disk caching and reduce logging overhead
cache deny all
access_log none
cache_log /dev/stderr
cache_store_log none